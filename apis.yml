aid: skopenow
name: Skopenow
description: >-
  Skopenow is an open-source intelligence (OSINT) platform built to modernize
  digital investigations. Founded in 2015 and backed by Techstars, it fuses
  public records, consumer data, crime data, news, and online content with
  AI-powered fraud and threat-detection models to generate intelligence reports
  on entities, uncover and visualize networks between people and organizations,
  and surface operational risks. Its product suite spans Grid, Pre-Check,
  Workbench, Link Analysis, and Rabbit, serving global security, insurance,
  government, law enforcement, legal, and media teams — more than 1,500
  organizations, including a fifth of the Fortune 500. Skopenow ships as a
  login-gated web application rather than a public developer API.
